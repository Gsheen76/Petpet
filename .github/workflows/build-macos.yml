name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing draft release tag to upload the ZIP into
        required: false
        type: string

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/build.txt

      - name: Build Petpet.app
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Create portable zip
        run: |
          VERSION="$(python3 -c 'from version import VERSION; print(VERSION)')"
          ditto -c -k --sequesterRsrc --keepParent dist/Petpet.app "dist/Petpet-v${VERSION}-macOS-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Petpet-macOS-${{ matrix.arch }}
          path: dist/Petpet-v*-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload portable zip to draft release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ inputs.release_tag }}"
          dist/Petpet-v*-macOS-${{ matrix.arch }}.zip
