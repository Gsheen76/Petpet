name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offscreen-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyQt5>=5.15,<6" "requests>=2.31,<3" "Pillow>=10" "numpy>=1.26" pytest

      - name: Run offscreen test suite
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONPATH = "."
          python -m pytest -q
