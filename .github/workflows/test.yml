name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offscreen-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 走 runtime.txt 本身——契约文件必须被真实验证
          # （2026-09-11 教训：显式罗列曾让缺 Pillow/numpy 的腐化清单漏网）。
          pip install -r requirements/runtime.txt pytest

      - name: Run offscreen test suite
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONPATH = "."
          python -m pytest -q
